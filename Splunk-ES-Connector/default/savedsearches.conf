[IDMEFv2 - Splunk ES Incident Review Changes]
disabled = 1

search = search index=notable earliest=-10m latest=now source_event_id=* \
| eval review_epoch=tonumber(coalesce(orig_time, time, _time)) \
| where isnotnull(review_epoch) \
| eval review_time_iso=strftime(review_epoch, "%Y-%m-%dT%H:%M:%S%z") \
| eval event_type="finding_created" \
| eval source_system="splunk_es" \
| eval source_component="index=notable" \
| eval rule_id=source_event_id \
| eval status="1" \
| lookup reviewstatuses_lookup status OUTPUT label as status_label end as status_end \
| eval status_label=coalesce(status_label, "New") \
| eval event_uid=rule_id . "::created" \
| eval rule_title=coalesce(rule_title, orig_rule_title, search_name) \
| eval rule_description=coalesce(rule_description, orig_rule_description) \
| eval security_domain=coalesce(security_domain, orig_security_domain) \
| eval description=coalesce(description, message, rule_description, search_name) \
| table source_system source_component event_type event_uid rule_id status status_label status_end review_epoch review_time_iso user owner comment _time orig_time firstTime lastTime search_name source_event_id source_guid event_id ir_lookup_key detection_id rule_name rule_title rule_description description message note priority severity urgency category threat_category security_domain src src_ip src_host src_port src_user src_category dest dest_ip dest_host dest_port dest_user dest_category recipient risk_score risk_object risk_object_type risk_object_category confidence dvc dvc_ip dvc_name dvc_host dvc_category dvc_bunit orig_host host location source app service protocol vendor_product product_version file_hash file_name file_size sourcetype index scanned_ports signature signature_id annotations annotations.mitre_attack annotations.mitre_attack.mitre_tactic annotations.mitre_attack.mitre_tactic_id annotations.mitre_attack.mitre_technique annotations.mitre_attack.mitre_technique_id \
| append [ \
    | inputlookup incident_review_lookup \
    | eval review_epoch=tonumber(coalesce(review_time, time)) \
    | where isnotnull(review_epoch) AND review_epoch >= relative_time(now(), "-10m") \
    | lookup reviewstatuses_lookup status OUTPUT label as status_label end as status_end \
    | eval review_time_iso=strftime(review_epoch, "%Y-%m-%dT%H:%M:%S%z") \
    | eval event_type="incident_review_status_change" \
    | eval source_system="splunk_es" \
    | eval source_component="incident_review_lookup" \
    | eval event_uid=coalesce(_key, rule_id . "::" . tostring(review_epoch) . "::" . tostring(status)) \
    | table source_system source_component event_type event_uid _key rule_id status status_label status_end review_epoch review_time_iso user owner comment \
] \
| where isnotnull(rule_id) AND rule_id!="" \
| dedup event_uid \
| sort 0 rule_id review_epoch

cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1

alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 0

action.idmefv2_internal_alert_action = 1
action.idmefv2_internal_alert_action.param.enable_http_delivery = 0
action.idmefv2_internal_alert_action.param.target_url =
action.idmefv2_internal_alert_action.param.auth_type = none
action.idmefv2_internal_alert_action.param.auth_token =
action.idmefv2_internal_alert_action.param.auth_username =
action.idmefv2_internal_alert_action.param.auth_password =
action.idmefv2_internal_alert_action.param.verify_ssl = 1
action.idmefv2_internal_alert_action.param.timeout_seconds = 30
action.idmefv2_internal_alert_action.param.enable_notable_enrichment = 1
action.idmefv2_internal_alert_action.param.notable_earliest = -365d
action.idmefv2_internal_alert_action.param.minimum_notable_match_score = 70
action.idmefv2_internal_alert_action.param.dedup_enabled = 1
action.idmefv2_internal_alert_action.param.debug_dump_payload = 0

action.idmefv2_internal_alert_action.param.organisation_name = CHANGE-ME
action.idmefv2_internal_alert_action.param.organisation_id = CHANGE-ME
action.idmefv2_internal_alert_action.param.entity_name = CHANGE-ME
action.idmefv2_internal_alert_action.param.entity_id = CHANGE-ME
action.idmefv2_internal_alert_action.param.analyzer_name = Splunk ES
action.idmefv2_internal_alert_action.param.analyzer_model = Splunk Enterprise Security
action.idmefv2_internal_alert_action.param.analyzer_hostname =